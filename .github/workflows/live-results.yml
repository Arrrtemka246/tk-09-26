name: Live Team Kulik updater

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-results.yml'
      - 'scripts/live_probe.py'
  schedule:
    - cron: '13 3,6,9,12,15,18 * * *'

permissions:
  contents: write

concurrency:
  group: team-kulik-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install requests==2.32.5 beautifulsoup4==4.14.2 pypdf==6.1.1
      - name: Configure updater identity
        run: |
          git config user.name "team-kulik-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Adaptive live refresh
        env:
          TZ: Europe/Moscow
        run: |
          DAY="$(date +%F)"
          if [[ "$DAY" < "2026-09-27" || "$DAY" > "2026-09-30" ]]; then
            echo "Outside competition dates; nothing to do."
            exit 0
          fi

          for n in $(seq 1 1600); do
            echo "Probe $n at $(date '+%F %T %Z')"
            git pull --rebase origin main || true

            OUT="$(python scripts/live_probe.py 2>&1 || true)"
            echo "$OUT"

            # Full reconciliation roughly every 10 minutes as a safety net.
            if (( n == 1 || n % 24 == 0 )); then
              python scripts/update_results.py || true
            fi

            if ! git diff --quiet -- data/results.json; then
              git add data/results.json
              git commit -m "Update Team Kulik results [skip ci]"
              git pull --rebase origin main
              git push origin main
            fi

            SLEEP="$(printf '%s\n' "$OUT" | awk -F= '/^SLEEP=/{print $2}' | tail -1)"
            if ! [[ "$SLEEP" =~ ^[0-9]+$ ]]; then SLEEP=30; fi
            sleep "$SLEEP"
          done
